[project]
name = "quicklaunch-ai"
version = "0.1.0"
description = "A blazing-fast, floating Spotlight / Raycast-style AI launcher for Windows powered by PySide6, Gemini, and Google Antigravity"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = [
    "quicklaunch",
    "raycast",
    "spotlight",
    "launcher",
    "gemini",
    "google-genai",
    "antigravity",
    "pyside6",
    "ai-assistant",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "Topic :: Utilities",
]
dependencies = [
    "google-antigravity>=0.1.16",
    "google-genai",
    "markdown",
    "pydantic",
    "pyside6",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
